[project]
name = "researchbot"
version = "1.0.0"
description = "AI Web Research Agent - autonomous search, scrape, summarize, and synthesize from multiple web sources"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Akash"},
]
keywords = ["research", "web-scraping", "nlp", "summarization", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "streamlit>=1.40.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "spacy>=3.8.0",
    "scikit-learn>=1.5.0",
    "ddgs>=7.0.0",
    "fpdf2>=2.8.0",
    "lxml>=5.0.0",
    "urllib3>=2.0.0",
]

[project.scripts]
researchbot = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
